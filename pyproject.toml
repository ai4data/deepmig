[project]
name = "deepmig"
version = "0.2.0"
description = "AI-powered migration agent for legacy ETL to modern platforms. Migrate SSIS, Informatica, and other legacy pipelines to Databricks, Snowflake, and cloud platforms."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<4.0"
keywords = ["migration", "etl", "ssis", "databricks", "snowflake", "data-pipeline", "ai-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "deepagents>=0.2.7",
    "deepagents-cli>=0.0.9",
    "networkx>=3.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "jinja2>=3.0",
]

[project.optional-dependencies]
# LLM Provider packages - install only what you need
azure = ["langchain-openai>=0.1.0"]
openai = ["langchain-openai>=0.1.0"]
anthropic = ["langchain-anthropic>=0.1.0"]
google = ["langchain-google-genai>=1.0.0"]
# Chinese models use OpenAI-compatible API
deepseek = ["langchain-openai>=0.1.0"]
qwen = ["langchain-openai>=0.1.0"]
zhipu = ["langchain-openai>=0.1.0"]

# Convenience bundles
all-providers = [
    "langchain-openai>=0.1.0",
    "langchain-anthropic>=0.1.0",
    "langchain-google-genai>=1.0.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/anthropics/deepmig"
Documentation = "https://github.com/anthropics/deepmig#readme"
Repository = "https://github.com/anthropics/deepmig"
Issues = "https://github.com/anthropics/deepmig/issues"

[project.scripts]
deepmig = "agent.cli:main"

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
link-mode = "copy"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent = [
    "bundled_skills/**/*.md",
    "bundled_skills/**/*.json",
    "bundled_skills/**/*.py",
    "prompts/templates/**/*.j2",
    "prompts/templates/**/*.md.j2",
    "prompts/config/*.yaml",
]
