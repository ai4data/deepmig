[project]
name = "deepmig"
version = "0.2.0"
description = "AI-powered migration agent for legacy ETL to modern platforms. Migrate SSIS, Informatica, and other legacy pipelines to Databricks, Snowflake, and cloud platforms."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<4.0"
keywords = ["migration", "etl", "ssis", "databricks", "snowflake", "data-pipeline", "ai-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "deepagents>=0.2.8",
    "deepagents-cli>=0.0.10",
    "networkx>=3.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/anthropics/deepmig"
Documentation = "https://github.com/anthropics/deepmig#readme"
Repository = "https://github.com/anthropics/deepmig"
Issues = "https://github.com/anthropics/deepmig/issues"

[project.scripts]
deepmig = "agent.cli:main"

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent = [
    "bundled_skills/**/*.md",
    "bundled_skills/**/*.json",
    "bundled_skills/**/*.py",
]
